name: KQL lint (example)

# Copy this workflow into your detections repo.
# Requires the compiled CLI (`npm ci` + `npm run compile`) or:
#   npx --yes kql-assistant@0.10.1 lint ...
# once published with these flags.

on:
  push:
    paths:
      - '**/*.kql'
      - '**/*.kusto'
      - '**/*.yaml'
      - '**/*.yml'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Lint KQL and Sentinel YAML
        run: |
          node out/src/cli.js lint 'detections/**/*.{kql,yaml,yml}' \
            --format sarif \
            --fail-on warning \
            --lint basic \
            > kql-assistant.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: kql-assistant.sarif
          category: kql-assistant
